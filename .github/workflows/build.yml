name: Build

on:
  push:
    tags: ['v*']

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# The Android SDK packages the build uses, installed explicitly so a change
# in the runner image can't swap them. BUILD_TOOLS matches buildToolsVersion
# in app/build.gradle.kts and is also where apksigner comes from.
env:
  BUILD_TOOLS: 37.0.0
  PLATFORM: android-37.2

jobs:
  # Tests and lint run in a job without the signing secrets, so nothing
  # they execute (tests, Gradle plugins, lint checks) can read the key.
  check:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          set -euo pipefail
          count=$(grep -c -E '^\s*versionName\s*=\s*"([^"]+)"\s*$' app/build.gradle.kts || true)
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly one versionName line in app/build.gradle.kts, found $count"
            exit 1
          fi
          version=$(sed -n -E 's/^\s*versionName\s*=\s*"([^"]+)"\s*$/\1/p' app/build.gradle.kts)
          if ! [[ "$version" =~ ^[0-9A-Za-z._-]+$ ]]; then
            echo "::error::versionName '$version' has unsupported characters"
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match versionName $version"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME is not reachable from main"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17.0.21'
          cache: gradle

      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;$BUILD_TOOLS" "platforms;$PLATFORM"'

      - name: Test and lint
        run: ./gradlew :app:testDebugUnitTest :app:lintRelease

  build:
    needs: check
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      apk: ${{ steps.apk.outputs.file }}
      artifact: ${{ steps.apk.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::repository secret SIGNING_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          if [ -z "$STORE_PASSWORD" ]; then
            echo "::error::repository secret SIGNING_STORE_PASSWORD is not set"
            exit 1
          fi

      # No Gradle cache here: the check job could have saved one, and
      # whatever its code wrote there would run next to the key.
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17.0.21'

      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;$BUILD_TOOLS" "platforms;$PLATFORM"'

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      # Without the daemon and the configuration cache, nothing keeps the
      # signing values after this step.
      - name: Build the signed release APK
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: eapenroll
        run: ./gradlew --no-daemon --no-configuration-cache :app:assembleRelease

      - name: Check signature
        env:
          EXPECTED_SHA256: ${{ vars.SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [ -z "$EXPECTED_SHA256" ]; then
            echo "::error::repository variable SIGNING_CERT_SHA256 is not set"
            exit 1
          fi
          apksigner="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          actual="$("$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk \
            | sed -n -E 's/^.*[Ss]igner.* certificate SHA-256 digest: *([0-9a-fA-F:]+)$/\1/p' \
            | tr -d ':' | tr '[:upper:]' '[:lower:]' | sort -u)"
          expected="$(echo "$EXPECTED_SHA256" | tr -d ': ' | tr '[:upper:]' '[:lower:]')"
          # apksigner prints "Signer #1 ..." or "V2 Signer: ..." depending on version;
          # require exactly one distinct signer certificate.
          if [ -z "$actual" ] || [ "$(echo "$actual" | wc -l)" -ne 1 ]; then
            echo "::error::expected exactly one signer certificate SHA-256 digest, got: ${actual:-none}"
            exit 1
          fi
          if [ "$actual" != "$expected" ]; then
            echo "::error::signing certificate mismatch: expected $expected, got $actual"
            exit 1
          fi

      - name: Name the APK
        id: apk
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          file="eap-enroll-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "artifact=${file%.apk}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.apk.outputs.artifact }}
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

  release:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          APK: ${{ needs.build.outputs.apk }}
        run: |
          set -euo pipefail
          file="dist/$APK"
          # gh creates a release as a draft, uploads the APK and then
          # publishes it, so a run that failed on the way can leave a
          # draft; a re-run finishes that one. A published release keeps
          # its APK: a re-run must not replace a file already installed.
          error="$RUNNER_TEMP/gh-release-view.err"
          if draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>"$error"); then
            if [ "$draft" != "true" ]; then
              echo "::error::release $TAG is already published; its APK stays as it is"
              exit 1
            fi
            gh release upload "$TAG" "$file" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
          elif grep -q 'release not found' "$error"; then
            gh release create "$TAG" "$file" --verify-tag --title "$TAG" --generate-notes --repo "$GITHUB_REPOSITORY"
          else
            echo "::error::could not look up release $TAG: $(cat "$error")"
            exit 1
          fi
